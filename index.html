<style>
  :root{
    --paper: #ECE6D6; --paper-2: #E3DBC6; --ink: #26221B;
    --forest: #34493A; --water: #1F6478; --rust: #A6461F; --ochre: #C68A2E;
    --line: #B9AE93; --line-soft: #cfc6a8; --accent: var(--water);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper);
    background-image: radial-gradient(circle at 1px 1px, rgba(38,34,27,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink); font-family:'IBM Plex Sans', sans-serif; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:820px; margin:0 auto; padding:0 24px;}

  header.hero{ padding:48px 0 26px; border-bottom:2px solid var(--ink); }
  .top-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--forest); margin:0; }
  .lang-switch{ display:flex; border:1px solid var(--line); border-radius:100px; overflow:hidden; }
  .lang-switch button{ font-family:'IBM Plex Mono', monospace; font-size:12px; padding:5px 12px; border:none; background:transparent; cursor:pointer; color:#6b6350; }
  .lang-switch button.active{ background:var(--ink); color:var(--paper); }
  h1.title{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(34px, 7.5vw, 58px); line-height:0.98; margin:0 0 6px; letter-spacing:-0.01em; }
  h1.title em{ font-style:italic; font-weight:500; color:var(--rust); }
  .tagline{ font-size:16px; max-width:56ch; color:#4a4436; margin:14px 0 26px; }

  .legend{ display:flex; border:1px solid var(--ink); margin-bottom:6px; flex-wrap:wrap; }
  .legend button{
    flex:1 1 33%; font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; font-weight:600; color:var(--ink);
    background:transparent; border:none; border-right:1px solid var(--ink);
    padding:14px 14px 12px; cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:8px;
    transition:background 0.2s, color 0.2s;
  }
  .legend button:last-child{border-right:none;}
  .legend button .line-icon{width:36px; height:2px;}
  .legend button[data-key="eau"] .line-icon{ background:var(--water); }
  .legend button[data-key="aventure"] .line-icon{ background-image:repeating-linear-gradient(to right, var(--rust) 0 6px, transparent 6px 10px); height:2px; }
  .legend button[data-key="patrimoine"] .line-icon{ background-image:radial-gradient(circle, var(--forest) 1.4px, transparent 1.4px); background-size:6px 2px; background-repeat:repeat-x; height:2px;}
  .legend button .sub{font-family:'IBM Plex Mono', monospace; font-size:11px; font-weight:400; color:#6b6350;}
  .legend button.active{ background:var(--ink); color:var(--paper); }
  .legend button.active .sub{ color:#cfc6a8; }
  .legend button.active .line-icon{ filter:brightness(1.7); }

  .stat-row{ display:flex; flex-wrap:wrap; border-top:1px solid var(--line); }
  .stat{ flex:1 1 110px; padding:14px 16px 4px 14px; border-right:1px solid var(--line); }
  .stat:last-child{border-right:none;}
  .stat .num{ font-family:'IBM Plex Mono', monospace; font-size:19px; color:var(--accent); display:block; transition:color 0.3s; }
  .stat .label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:#6b6350; }

  main{position:relative; padding:8px 0 40px;}
  .spine-line{ position:absolute; left:14px; top:0; bottom:0; width:2px; background:repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 11px); }
  @media (max-width:600px){ .spine-line{left:10px;} }

  .day{ position:relative; padding:38px 0 38px 46px; border-bottom:1px dashed var(--line-soft); animation:fadeIn 0.35s ease; }
  .day:last-of-type{border-bottom:none;}
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .day-marker{ position:absolute; left:0; top:42px; width:30px; height:30px; border-radius:50%; background:var(--paper); border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; color:var(--accent); transition:border-color 0.3s, color 0.3s; }
  @media (max-width:600px){ .day{padding-left:34px;} .day-marker{width:24px;height:24px;font-size:10px;top:40px;} }

  .day-top{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; }
  .day-heading{ min-width:0; }
  .day-eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--rust); text-transform:uppercase; letter-spacing:0.1em; margin:0; }
  h2.day-title{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(21px, 4.5vw, 28px); margin:4px 0 0; line-height:1.08; }
  .day-meta{ flex:0 0 auto; padding-bottom:2px; }

  .meta-row{ display:flex; align-items:center; gap:6px; }
  .intensity .dots{ display:flex; gap:3px; }
  .intensity .dot{ width:7px; height:7px; border-radius:50%; border:1.5px solid var(--accent); }
  .intensity .dot.on{ background:var(--accent); }
  .intensity .txt{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:#6b6350; text-transform:uppercase; letter-spacing:0.06em; }

  .day-route{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:#6b6350; margin:10px 0 10px; letter-spacing:0.01em; line-height:1.7; }
  .day-route .route-time{ font-weight:600; color:var(--accent); }
  .day-route .route-sep{ color:var(--line-soft); }
  .day-route b{ color:var(--ink); font-weight:500; }
  .gmaps-icon{ display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; border:1px solid #b7d3d9; color:var(--water); flex-shrink:0; text-decoration:none; transition:color 0.15s, border-color 0.15s, background 0.15s; }
  .gmaps-icon:hover{ color:var(--rust); border-color:var(--rust); background:rgba(166,70,31,0.08); }
  .gmaps-icon svg{ width:12px; height:12px; }
  .gmaps-icon svg path, .gmaps-icon svg circle{ fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }

  .stops{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:12px; margin:14px 0 16px; }
  .stop{ border:1px solid var(--line); background:rgba(255,255,255,0.4); overflow:hidden; transition:transform 0.15s, box-shadow 0.15s; }
  .stop:hover{ transform:translateY(-2px); box-shadow:2px 3px 0 rgba(38,34,27,0.12); }
  .stop-photo{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; filter:saturate(0.95) sepia(0.05) contrast(1.02); border-bottom:1px solid var(--line); }
  .stop-body{ padding:11px 13px 12px; }
  .stop-name{ font-family:'IBM Plex Sans', sans-serif; font-size:13.5px; font-weight:600; color:var(--ink); margin:0 0 2px; }
  .stop-dur{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; margin:0 0 7px; display:inline-block; }
  .stop.cat-eau .stop-dur{ color:var(--water); }
  .stop.cat-rando .stop-dur{ color:var(--forest); }
  .stop.cat-histoire .stop-dur{ color:var(--ochre); }
  .stop.cat-aventure .stop-dur{ color:var(--rust); }
  .stop-desc{ font-family:'IBM Plex Sans', sans-serif; font-size:12.5px; color:#4a4436; margin:0; line-height:1.5; }

  .stop-where{ margin-top:9px; border-top:1px dashed var(--line); padding-top:8px; }
  .stop-where summary{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--forest); cursor:pointer; list-style:none; }
  .stop-where summary::-webkit-details-marker{ display:none; }
  .stop-where summary::before{ content:"▸ "; }
  .stop-where[open] summary::before{ content:"▾ "; }
  .stop-where .where-body{ margin-top:6px; font-size:12px; color:#4a4436; line-height:1.5; }
  .stop-where .where-body a.gps{ display:block; font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:var(--water); margin-bottom:3px; text-decoration:none; border-bottom:1px dotted #b7d3d9; }
  .stop-where .where-body a.gps:hover{ color:var(--rust); border-color:var(--rust); }

  .tags{display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; margin:0 0 2px;}
  .tag{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.04em; text-transform:uppercase; padding:4px 10px; border-radius:100px; border:1px solid transparent; }
  .tag.eau{background:#dcebee; color:var(--water); border-color:#b7d3d9;}
  .tag.rando{background:#e2e8e0; color:var(--forest); border-color:#c3d0c2;}
  .tag.histoire{background:#f2e6d0; color:var(--ochre); border-color:#e3cd9c;}
  .tag.aventure{background:#f2ddd2; color:var(--rust); border-color:#e5bfab;}

  .info-box{ max-width:64ch; width:100%; margin:14px 0 0; padding:14px 16px; font-size:14px; }
  .info-box .callout-label{ font-family:'IBM Plex Mono', monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; display:block; margin-bottom:4px; }
  .info-box a{ color:var(--water); text-decoration:none; border-bottom:1px dotted #b7d3d9; }
  .info-box a:hover{ color:var(--rust); border-color:var(--rust); }
  .info-box .resv-meta{ display:inline-block; margin-top:4px; font-family:'IBM Plex Mono', monospace; font-size:11.5px; color:#6b6350; }
  .callout{ background:var(--paper-2); border-left:3px solid var(--rust); border-top:none; border-right:none; border-bottom:none; }
  .callout .callout-label{ color:var(--rust); }
  .callout.bonus{ border-left-color:var(--ochre); }
  .callout.bonus .callout-label{ color:var(--ochre); }
  .dodo-box{ border:1px solid var(--line); background:rgba(255,255,255,0.35); }
  .dodo-box .callout-label{ color:var(--forest); }
  .alt-box{ border:1px dashed var(--ochre); background:rgba(198,138,46,0.07); }
  .alt-box .callout-label{ color:var(--ochre); }

  footer{ border-top:2px solid var(--ink); padding:32px 0 60px; }
  footer h3{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin:0 0 12px; }
  footer .note{ font-size:14px; color:#4a4436; margin:0 0 18px; max-width:64ch; }
  footer .note b{color:var(--ink);}
  .end-mark{ font-family:'Fraunces', serif; font-style:italic; font-size:16px; color:#5c5646; text-align:center; margin-top:30px; }
</style>
</head>

let currentVariant = "eau";

function applyStaticText(){
  const t = I18N[currentLang];
  document.getElementById('txt-eyebrow').textContent = t.eyebrow;
  document.getElementById('txt-tagline').textContent = t.tagline;
  ['eau','aventure','patrimoine'].forEach(key => {
    const btn = document.querySelector(`.legend button[data-key="${key}"]`);
    btn.querySelector('.lg-label').innerHTML = t.legend[key].label;
    btn.querySelector('.lg-sub').textContent = t.legend[key].sub;
  });
  document.getElementById('txt-footer-h3').textContent = t.footerH3;
  document.getElementById('txt-note1').innerHTML = t.note1;
  document.getElementById('txt-note2').innerHTML = t.note2;
  document.getElementById('txt-note3').innerHTML = t.note3;
  document.getElementById('txt-note4').innerHTML = t.note4;
  document.getElementById('txt-endmark').textContent = t.endmark;
  document.documentElement.lang = currentLang;
}

function renderStats(stats){
  const t = I18N[currentLang];
  document.getElementById('statRow').innerHTML = stats.map(s =>
    `<div class="stat"><span class="num">${s.num}</span><span class="label">${t.statLabels[s.labelKey]}</span></div>`
  ).join('');
}

function renderDays(days){
  const t = I18N[currentLang];
  const html = days.map((d,i) => {
    const dots = Array.from({length:5}, (_,j) => `<span class="dot ${j < d.intensity ? 'on':''}"></span>`).join('');
    const routeLine = d.routeStops.map((s,j) => j===0 ? `<b>${s}</b>` : s).join(' \u2192 ');
    const stopsHtml = d.stops.map(s => {
      const whereHtml = s.where ? `
        <details class="stop-where">
          <summary>${t.where}</summary>
          <div class="where-body">
            <a class="gps" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.where)}" target="_blank" rel="noopener">${s.where} \u2197</a>
            ${s.parking || ''}
          </div>
        </details>` : '';
      return `
      <div class="stop cat-${s.cat}">
        <img class="stop-photo" src="${IMG[s.img]}" alt="${s.name}">
        <div class="stop-body">
          <p class="stop-name">${s.name}</p>
          <span class="stop-dur">${s.dur}</span>
          <p class="stop-desc">${s.desc}</p>
          ${whereHtml}
        </div>
      </div>`;
    }).join('');
    const tagsHtml = d.tags.map(tg => `<span class="tag ${tg}">${t.tags[tg]}</span>`).join('');
    const calloutHtml = d.callout ? `<div class="info-box callout"><span class="callout-label">${d.callout.label}</span>${d.callout.text}</div>` : '';
    const bonusHtml = d.bonus ? `<div class="info-box callout bonus"><span class="callout-label">${d.bonus.label}</span>${d.bonus.text}</div>` : '';
    const dodoHtml = d.dodo ? `<div class="info-box dodo-box"><span class="callout-label">${d.dodo.label}</span>${d.dodo.text}</div>` : '';
    const altHtml = d.alt_dodo ? `<div class="info-box alt-box"><span class="callout-label">${d.alt_dodo.label}</span>${d.alt_dodo.text}</div>` : '';
    const gmapsIcon = d.gmaps ? `<a class="gmaps-icon" href="${d.gmaps}" target="_blank" rel="noopener" aria-label="${t.gmaps}" title="${t.gmaps}"><svg viewBox="0 0 24 24"><path d="M12 2 C7 2 4 5.5 4 9.5 C4 15 12 22 12 22 C12 22 20 15 20 9.5 C20 5.5 17 2 12 2 Z"/><circle cx="12" cy="9.5" r="2.5"/></svg></a>` : '';
    return `
      <section class="day">
        <div class="day-marker">${i+1}</div>
        <div class="day-top">
          <div class="day-heading">
            <p class="day-eyebrow">${d.eyebrow}</p>
            <h2 class="day-title">${d.title}</h2>
          </div>
          <div class="day-meta">
            <div class="meta-row intensity"><span class="txt">${t.intensite}</span><span class="dots">${dots}</span></div>
          </div>
        </div>
        <p class="day-route"><span class="route-time">${d.route}</span><span class="route-sep">\u00b7</span>${routeLine}${gmapsIcon}</p>
        <div class="tags">${tagsHtml}</div>
        <div class="stops">${stopsHtml}</div>
        ${calloutHtml}
        ${bonusHtml}
        ${dodoHtml}
        ${altHtml}
      </section>`;
  }).join('');
  document.getElementById('daysContainer').innerHTML = html;
}

function render(){
  document.documentElement.style.setProperty('--accent', ACCENT[currentVariant]);
  document.querySelectorAll('.legend button').forEach(b => b.classList.toggle('active', b.dataset.key === currentVariant));
  document.querySelectorAll('.lang-switch button').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  applyStaticText();
  const data = VARIANTS[currentLang][currentVariant];
  renderStats(data.stats);
  renderDays(data.days);
}

document.querySelectorAll('.legend button').forEach(btn => {
  btn.addEventListener('click', () => { currentVariant = btn.dataset.key; render(); });
});
document.querySelectorAll('.lang-switch button').forEach(btn => {
  btn.addEventListener('click', () => { currentLang = btn.dataset.lang; render(); });
});

render();
</script>
</body>
</html>
